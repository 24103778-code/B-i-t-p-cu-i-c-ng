<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - Dự Án CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

    <header>
        <h1>Thông Tin Liên Hệ</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="gallery.html">Thư viện ảnh</a></li>
                <li><a href="contact.html" class="active">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <h2>Gửi Nhắn Cho Chúng Tôi</h2>
        <div class="contact-container">
            <img src="image6.jpg" alt="Ảnh văn phòng làm việc" class="contact-img">
            <form action="#" method="post" class="contact-form">
                <label for="name">Họ và Tên:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Lời nhắn:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Gửi tin nhắn</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bản quyền thuộc về Dự Án CSS.</p>
    </footer>

</body>
</html>
